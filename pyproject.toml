[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-assistant"
version = "0.1.0"
description = "A safe, persistent, multi-agent personal assistant"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=3.1,<4",
  "pydantic>=2.12,<3",
  "openai>=1.109,<3",
  "google-genai>=2,<3",
  "google-api-python-client>=2.187,<3",
  "google-auth>=2.53,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "python-dotenv>=1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
voice = [
  "faster-whisper>=1.2,<2",
  "kokoro>=0.9,<1",
  "sounddevice>=0.5,<1",
  "numpy>=2,<3",
]

[project.scripts]
jarvis = "jarvis.main:main"

[tool.setuptools.packages.find]
include = ["jarvis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
